[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strident"
version = "1.1.0"
description = "Agentic run coaching, synced straight to your Garmin."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["skills/strident"]
include = ["scripts*"]
